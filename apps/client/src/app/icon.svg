<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    #light-mode { display: block; }
    #dark-mode { display: none; }

    @media (prefers-color-scheme: dark) {
      #light-mode { display: none; }
      #dark-mode { display: block; }
    }
  </style>

  <defs>
    <!-- ================= LIGHT MODE ================= -->
    <linearGradient id="light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6E9FF"/>
      <stop offset="100%" stop-color="#B9C6FA"/>
    </linearGradient>
    <linearGradient id="light-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3525CD"/>
    </linearGradient>
    <linearGradient id="light-ribbon-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1CB8"/>
      <stop offset="55%" stop-color="#3B30D6"/>
      <stop offset="100%" stop-color="#5B2FC9"/>
    </linearGradient>
    <linearGradient id="light-ribbon-bottom" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00835A"/>
      <stop offset="45%" stop-color="#2A1CB8"/>
      <stop offset="100%" stop-color="#1FBF86"/>
    </linearGradient>
    <filter id="light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B1170" flood-opacity="0.30"/>
    </filter>
    <filter id="light-tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3525CD" flood-opacity="0.35"/>
    </filter>

    <!-- ================= DARK MODE ================= -->
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#363C7E"/>
      <stop offset="55%" stop-color="#232968"/>
      <stop offset="100%" stop-color="#171B49"/>
    </linearGradient>
    <linearGradient id="dark-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6CF8BB"/>
    </linearGradient>
    <radialGradient id="dark-ambient-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dark-ribbon-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7C2FF"/>
    </linearGradient>
    <linearGradient id="dark-ribbon-bottom" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8FBE0"/>
      <stop offset="100%" stop-color="#4CF0A8"/>
    </linearGradient>
    <filter id="dark-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A0C2E" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#818CF8" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- LIGHT MODE: nền xanh-tím nhạt đậm hơn + viền indigo + bóng đổ, chữ S đậm -->
  <g id="light-mode">
    <g filter="url(#light-tile-shadow)">
      <rect x="20" y="20" width="984" height="984" rx="232" fill="url(#light-bg)"/>
    </g>
    <rect x="22" y="22" width="980" height="980" rx="230" fill="none" stroke="url(#light-rim)" stroke-width="8" stroke-opacity="0.85"/>
    <g transform="translate(512 512) scale(2.5) translate(-256 -256)" filter="url(#light-shadow)">
      <path d="M342 166 C342 118, 286 98, 232 108 C166 120, 134 176, 174 224 C202 256, 260 262, 310 282 L338 232 C292 214, 240 208, 222 186 C206 166, 224 148, 256 148 C282 148, 298 158, 304 178 Z" fill="url(#light-ribbon-top)"/>
      <path d="M170 346 C170 394, 226 414, 280 404 C346 392, 378 336, 338 288 C310 256, 252 250, 202 230 L174 280 C220 298, 272 304, 290 326 C306 346, 288 364, 256 364 C230 364, 214 354, 208 334 Z" fill="url(#light-ribbon-bottom)"/>
      <circle cx="256" cy="256" r="34" fill="#FFFFFF" stroke="#2A1CB8" stroke-width="3"/>
      <path d="M256 232 C259 248, 264 253, 280 256 C264 259, 259 264, 256 280 C253 264, 248 259, 232 256 C248 253, 253 248, 256 232 Z" fill="#2A1CB8"/>
    </g>
  </g>

  <!-- DARK MODE: nền xanh navy sáng hơn trang + viền sáng, chữ S trắng/mint -->
  <g id="dark-mode">
    <rect x="20" y="20" width="984" height="984" rx="232" fill="url(#dark-bg)"/>
    <rect x="20" y="20" width="984" height="984" rx="232" fill="url(#dark-ambient-glow)"/>
    <rect x="23" y="23" width="978" height="978" rx="229" fill="none" stroke="url(#dark-rim)" stroke-width="8"/>
    <g transform="translate(512 512) scale(2.5) translate(-256 -256)" filter="url(#dark-glow)">
      <path d="M342 166 C342 118, 286 98, 232 108 C166 120, 134 176, 174 224 C202 256, 260 262, 310 282 L338 232 C292 214, 240 208, 222 186 C206 166, 224 148, 256 148 C282 148, 298 158, 304 178 Z" fill="url(#dark-ribbon-top)"/>
      <path d="M170 346 C170 394, 226 414, 280 404 C346 392, 378 336, 338 288 C310 256, 252 250, 202 230 L174 280 C220 298, 272 304, 290 326 C306 346, 288 364, 256 364 C230 364, 214 354, 208 334 Z" fill="url(#dark-ribbon-bottom)"/>
      <circle cx="256" cy="256" r="34" fill="#171B49" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M256 232 C259 248, 264 253, 280 256 C264 259, 259 264, 256 280 C253 264, 248 259, 232 256 C248 253, 253 248, 256 232 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
