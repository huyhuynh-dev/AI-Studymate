<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <style>
    .sm-ai-stroke { stroke: #4F46E5; }
    .sm-ai-fill { fill: #4F46E5; }
    .sm-ai-dot { fill: #006C49; }

    @media (prefers-color-scheme: dark) {
      .sm-ai-stroke { stroke: #818CF8; }
      .sm-ai-fill { fill: #818CF8; }
      .sm-ai-dot { fill: #6CF8BB; }
    }
  </style>

  <!-- 2 Quỹ đạo Gyroscope tinh giản, sắc nét ở kích thước nhỏ -->
  <g transform="rotate(-28 12 12)">
    <ellipse
      cx="12"
      cy="12"
      rx="10"
      ry="4.3"
      class="sm-ai-stroke"
      stroke-width="1.65"
      stroke-dasharray="36 10.5"
      stroke-linecap="round"
    />
  </g>
  <g transform="rotate(32 12 12)">
    <ellipse
      cx="12"
      cy="12"
      rx="10"
      ry="4.3"
      class="sm-ai-stroke"
      stroke-width="1.65"
      stroke-dasharray="36 10.5"
      stroke-linecap="round"
    />
  </g>

  <!-- Lõi ngôi sao 4 cánh trung tâm + hạt vệ tinh -->
  <path
    d="M12 7.4Q12 12 16.6 12Q12 12 12 16.6Q12 12 7.4 12Q12 12 12 7.4Z"
    class="sm-ai-fill"
  />
  <circle cx="15.3" cy="8.7" r="1" class="sm-ai-dot" />
</svg>
